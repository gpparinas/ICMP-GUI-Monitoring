[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmon"
version = "2.0.0"
description = "Network Health Monitor - self-hosted uptime monitoring for small networks (ping, TCP, HTTP, DNS) with a web dashboard, history and alerts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Philip Parinas" }]
requires-python = ">=3.10"
keywords = ["monitoring", "uptime", "icmp", "ping", "network", "dashboard"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "icmplib>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
netmon = "netmon.cli:main"

[project.urls]
Homepage = "https://github.com/gpparinas/ICMP-GUI-Monitoring"

[tool.hatch.build.targets.wheel]
packages = ["src/netmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
